serenity {
  project.name = "Automation Test"
  take.screenshots = FOR_FAILURES
  logging = VERBOSE
}

webdriver {
  driver = chrome
  autodownload = true
  timeouts.implicitlywait = 5000
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "start-maximized", "incognito", "disable-infobars",
              "disable-gpu", "no-sandbox", "disable-dev-shm-usage"]
    }
  }
}

headless.mode = false

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
  staging {
    webdriver.base.url = "https://www.saucedemo.com"
  }
}

# Package that holds the tests; sub-packages become report "requirements"
serenity.test.root = "com.darvin.playground"

# Pause after every UI interaction (ms). Set to 0 to run at full speed.
interaction.delay = 2000

# ---------------------------------------------------------------------------
# Websites for the feature A comparison: connection details only.
# How to log in and reach feature A (steps, locators) lives in each site's
# module under com.darvin.playground.sites.<key>.
# Env vars <KEY>_URL / <KEY>_USERNAME / <KEY>_PASSWORD (e.g. SITE2_PASSWORD)
# win over these values, so real secrets stay out of this file.
# Simulation: all three point to saucedemo with different users.
# ---------------------------------------------------------------------------
sites {
  site1 {
    name = "Website 1 (main)"
    url = "https://www.saucedemo.com"
    username = "standard_user"
    password = "secret_sauce"
  }
  site2 {
    name = "Website 2"
    url = "https://www.saucedemo.com"
    username = "visual_user"
    password = "secret_sauce"
  }
  site3 {
    name = "Website 3"
    url = "https://www.saucedemo.com"
    username = "error_user"
    password = "secret_sauce"
  }
}

# Which modules to compare. Override per run, e.g.
#   mvn clean verify -Dgroups=comparison -Dcomparison.targets=site2
#   mvn clean verify -Dgroups=comparison -Dcomparison.targets=site3
comparison {
  main = "site1"
  targets = "site2,site3"
}
